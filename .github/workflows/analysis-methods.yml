name: Analysis Methods

on:
  pull_request:
    paths:
      - "analysis-methods/**"
      - ".claude-plugin/marketplace.json"
      - "gen/SKILL.md"
      - "office-files/SKILL.md"
      - ".github/workflows/analysis-methods.yml"
  push:
    branches: [main]
    paths:
      - "analysis-methods/**"
      - ".claude-plugin/marketplace.json"
      - "gen/SKILL.md"
      - "office-files/SKILL.md"
      - ".github/workflows/analysis-methods.yml"

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify analytical helper behavior
        run: python3 -m unittest discover -s analysis-methods/tests -v
      - name: Validate the documented evidence example
        run: python3 analysis-methods/scripts/check_evidence.py analysis-methods/assets/evidence.example.json
