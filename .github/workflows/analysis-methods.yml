name: Analysis Methods

on:
  pull_request:
    paths:
      - "analysis-methods/**"
      - ".claude-plugin/marketplace.json"
      - "gen/SKILL.md"
      - "office-files/SKILL.md"
      - ".github/workflows/analysis-methods.yml"
  push:
    branches: [main]
    paths:
      - "analysis-methods/**"
      - ".claude-plugin/marketplace.json"
      - "gen/SKILL.md"
      - "office-files/SKILL.md"
      - ".github/workflows/analysis-methods.yml"

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify imported helpers on their upstream examples
        run: |
          python3 analysis-methods/scripts/validate_evidence_ledger.py analysis-methods/assets/source_ledger_template.csv
          python3 analysis-methods/scripts/audit_claim_citations.py analysis-methods/assets/claims_ledger_template.csv analysis-methods/assets/source_ledger_template.csv
          python3 analysis-methods/scripts/calculate_market_sizing.py analysis-methods/assets/market_sizing_scenarios_template.json
          python3 analysis-methods/scripts/forecast_sensitivity.py analysis-methods/assets/forecast_sensitivity_template.json
          python3 analysis-methods/scripts/check_unit_consistency.py analysis-methods/assets/consistency_check_template.csv
