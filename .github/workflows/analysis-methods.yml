name: Analysis Methods

on:
  pull_request:
    paths:
      - "flux-analysis/**"
      - "stats-methods/**"
      - "analysis-qa/**"
      - "marketing-analytics/**"
      - "campaign-strategy/**"
      - "research-synthesis/**"
      - "tests/analysis-methods/**"
      - ".github/workflows/analysis-methods.yml"
  push:
    branches: [main]
    paths:
      - "flux-analysis/**"
      - "stats-methods/**"
      - "analysis-qa/**"
      - "marketing-analytics/**"
      - "campaign-strategy/**"
      - "research-synthesis/**"
      - "tests/analysis-methods/**"
      - ".github/workflows/analysis-methods.yml"

jobs:
  exact-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bridge arithmetic and input contracts
        run: python3 -m unittest discover -s tests/analysis-methods -v
