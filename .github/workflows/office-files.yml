name: Office files

on:
  pull_request:
    paths:
      - "office-files/**"
      - ".github/workflows/office-files.yml"
  push:
    branches: [main]
    paths:
      - "office-files/**"
      - ".github/workflows/office-files.yml"

jobs:
  native-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-liberation fonts-noto-core fonts-noto-cjk
          python -m pip install python-docx==1.2.0 typst==0.15.0 Pillow==12.3.0 pypdf==6.20.0
      - name: Verify native artifacts and render reuse
        run: python -m unittest discover -s office-files/tests -v
