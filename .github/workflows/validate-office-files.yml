name: Validate document layout

on:
  pull_request:
    paths:
      - "office-files/**"
      - ".github/workflows/validate-office-files.yml"
  push:
    branches: [main]
    paths:
      - "office-files/**"
      - ".github/workflows/validate-office-files.yml"

permissions:
  contents: read

jobs:
  document-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: office-files/requirements.txt
      - name: Install document renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-noto-core fonts-noto-cjk
          python -m pip install -r office-files/requirements.txt
      - name: Verify rendering and artifact-bound acceptance
        run: python -m unittest discover -s office-files/tests -p 'test_*.py' -v
