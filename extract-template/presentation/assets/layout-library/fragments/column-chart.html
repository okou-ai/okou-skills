<main class="pl-layout" data-layout="column-chart">
  <header class="pl-header">
    <p class="pl-kicker" data-region="kicker">Chart</p>
    <h1 class="pl-title" data-region="title">Compare results across ordered periods</h1>
    <p class="pl-subtitle" data-region="subtitle">Sample content · replace with your source material.</p>
  </header>
  <div class="pl-body">
    <div class="pl-chart pl-grid pl-cols-4" data-region="chart" role="img" aria-label="Illustrative requests completed: Q1 40, Q2 60, Q3 80, Q4 70; scale zero to one hundred requests">
      <figure class="pl-stack"><p class="pl-caption">40</p><div class="pl-bar-track"><div class="pl-bar pl-series-1" style="--pl-value: 40%"></div></div><figcaption class="pl-chart-label">Q1</figcaption></figure>
      <figure class="pl-stack"><p class="pl-caption">60</p><div class="pl-bar-track"><div class="pl-bar pl-series-1" style="--pl-value: 60%"></div></div><figcaption class="pl-chart-label">Q2</figcaption></figure>
      <figure class="pl-stack"><p class="pl-caption">80</p><div class="pl-bar-track"><div class="pl-bar pl-series-1" style="--pl-value: 80%"></div></div><figcaption class="pl-chart-label">Q3</figcaption></figure>
      <figure class="pl-stack"><p class="pl-caption">70</p><div class="pl-bar-track"><div class="pl-bar pl-series-1" style="--pl-value: 70%"></div></div><figcaption class="pl-chart-label">Q4</figcaption></figure>
    </div>
    <p class="pl-caption" data-region="scale">Requests completed · common scale: 0–100 requests · illustrative values</p>
    <p class="pl-caption" data-region="source">Replace with period definitions and source.</p>
  </div>
</main>
