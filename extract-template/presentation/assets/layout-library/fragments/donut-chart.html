<main class="pl-layout" data-layout="donut-chart">
  <header class="pl-header">
    <p class="pl-kicker" data-region="kicker">Chart</p>
    <h1 class="pl-title" data-region="title">Three parts of a clearly defined whole</h1>
    <p class="pl-subtitle" data-region="subtitle">Sample content · replace with your source material.</p>
  </header>
  <div class="pl-body">
    <div class="pl-grid pl-cols-2">
      <figure class="pl-chart" data-region="chart">
        <svg viewBox="0 0 256 256" role="img" aria-label="Illustrative request mix: standard 55 percent, custom 30 percent, other 15 percent">
          <circle class="pl-chart-segment pl-series-1" cx="128" cy="128" r="88" pathLength="100" stroke-dasharray="55 45" stroke-dashoffset="0" transform="rotate(-90 128 128)"></circle>
          <circle class="pl-chart-segment pl-series-2" cx="128" cy="128" r="88" pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="-55" transform="rotate(-90 128 128)"></circle>
          <circle class="pl-chart-segment pl-series-3" cx="128" cy="128" r="88" pathLength="100" stroke-dasharray="15 85" stroke-dashoffset="-85" transform="rotate(-90 128 128)"></circle>
        </svg>
        <figcaption class="pl-caption">Share of all requests (%) · illustrative values</figcaption>
      </figure>
      <div class="pl-stack">
        <ul class="pl-legend pl-list pl-stack" data-region="legend"><li class="pl-series-1">Standard · 55%</li><li class="pl-series-2">Custom · 30%</li><li class="pl-series-3">Other · 15%</li></ul>
        <p class="pl-copy" data-region="insight">Explain what the largest share means for the decision.</p>
      </div>
    </div>
    <p class="pl-caption" data-region="source">Replace with the denominator, reporting period, and source; shares must total 100%.</p>
  </div>
</main>
