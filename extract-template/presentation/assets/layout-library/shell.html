<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation layout preview</title>
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    html, body { margin: 0; height: 100%; background: #151515; }
    .deck { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; }
    .slide { display: flex; align-items: center; justify-content: center; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
    @media print { .deck { height: auto; overflow: visible; } .slide { height: 100vh; break-after: page; } }
  </style>
</head>
<body>
  <div class="deck" aria-label="Presentation">
    <!-- BEGIN SLIDES -->
    <!-- END SLIDES -->
  </div>
  <script>
    (() => {
      const deck = document.querySelector('.deck');
      const slides = [...deck.querySelectorAll(':scope > .slide')];
      document.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
            event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
        const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[event.key];
        if (!step || !slides.length) return;
        event.preventDefault();
        const top = deck.getBoundingClientRect().top;
        const active = slides.reduce((best, slide, index) =>
          Math.abs(slide.getBoundingClientRect().top - top) <
          Math.abs(slides[best].getBoundingClientRect().top - top) ? index : best, 0);
        const next = Math.max(0, Math.min(slides.length - 1, active + step));
        deck.scrollTo({ top: deck.scrollTop + slides[next].getBoundingClientRect().top - top, behavior: 'instant' });
      });
    })();
  </script>
</body>
</html>
