<section class="builtin-layout" data-layout="appendix-index">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <article class="bl-item" data-repeat="references">
        <div data-text-role="label">{{reference-number}}</div>
        <div data-text-role="heading">{{reference-title}}</div>
        <div data-text-role="caption">{{reference-location}}</div>
      </article>
    </div>
  </div>
</section>
