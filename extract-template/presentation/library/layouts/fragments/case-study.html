<section class="builtin-layout" data-layout="case-study">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="heading">{{situation}}</div>
        <div data-text-role="body">{{challenge}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{intervention}}</div>
        <div data-text-role="body">{{outcome}}</div>
        <div data-text-role="caption">{{case-note}}</div>
      </div>
    </div>
  </div>
</section>
