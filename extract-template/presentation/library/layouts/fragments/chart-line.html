<section class="builtin-layout" data-layout="chart-line">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-plot">
      <svg viewBox="0 0 600 300" role="img" aria-label="{{chart-description}}" data-chart-kind="line">
        <path data-component="chart-axis" d="M32 16V280H580" fill="none" stroke="currentColor" />
        <path d="{{line-path}}" fill="none" stroke="currentColor" data-series="{{series}}" data-plot-mark="line" />
        <g data-repeat="marks">
          <circle cx="{{point-x}}" cy="{{point-y}}" r="{{point-radius}}" fill="currentColor" data-plot-mark="point" />
          <text x="{{label-x}}" y="{{label-y}}" data-text-role="label" fill="currentColor">{{mark-label}}</text>
        </g>
      </svg>
    </div>
    <div data-text-role="caption">{{chart-note}}</div>
  </div>
</section>
