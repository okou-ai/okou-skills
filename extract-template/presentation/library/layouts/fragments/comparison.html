<section class="builtin-layout" data-layout="comparison">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="heading">{{option-a}}</div>
        <div data-text-role="body">{{evidence-a}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{option-b}}</div>
        <div data-text-role="body">{{evidence-b}}</div>
      </div>
    </div>
  </div>
</section>
