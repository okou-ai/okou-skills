<section class="builtin-layout" data-layout="cover">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <div data-text-role="label">{{eyebrow}}</div>
      <div data-text-role="body">{{subtitle}}</div>
      <div data-text-role="caption">{{presenter}}</div>
    </div>
  </div>
</section>
