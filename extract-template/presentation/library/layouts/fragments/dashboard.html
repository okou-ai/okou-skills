<section class="builtin-layout" data-layout="dashboard">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <div class="bl-grid bl-columns-4">
        <article class="bl-stack" data-repeat="metrics">
          <div data-text-role="metric-value">{{metric-value}}</div>
          <div data-text-role="label">{{metric-label}}</div>
          <div data-text-role="caption">{{metric-note}}</div>
        </article>
      </div>
      <div class="bl-grid bl-columns-2">
        <div class="bl-stack">
          <div data-text-role="heading">{{signal}}</div>
          <div data-text-role="body">{{diagnosis}}</div>
        </div>
        <div class="bl-stack">
          <div data-text-role="heading">{{recommendation}}</div>
          <div data-text-role="body">{{action}}</div>
        </div>
      </div>
    </div>
  </div>
</section>
