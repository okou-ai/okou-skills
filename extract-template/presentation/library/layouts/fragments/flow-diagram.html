<section class="builtin-layout" data-layout="flow-diagram">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-plot">
      <svg viewBox="0 0 600 300" role="img" aria-label="{{diagram-description}}" data-diagram-kind="directed-flow">
        <g data-repeat="edges">
          <path d="{{edge-path}}" fill="none" stroke="currentColor" data-component="connector" />
        </g>
        <g data-repeat="nodes">
          <rect x="{{node-x}}" y="{{node-y}}" width="{{node-width}}" height="{{node-height}}" fill="none" stroke="currentColor" data-component="diagram-node" />
          <text x="{{node-label-x}}" y="{{node-label-y}}" data-text-role="label" fill="currentColor">{{node-label}}</text>
        </g>
      </svg>
    </div>
    <div data-text-role="caption">{{diagram-note}}</div>
  </div>
</section>
