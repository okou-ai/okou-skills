<section class="builtin-layout" data-layout="forecast-scenarios">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <article class="bl-stack" data-repeat="scenarios">
        <div data-text-role="heading">{{scenario-name}}</div>
        <div data-text-role="metric-value">{{scenario-value}}</div>
        <div data-text-role="body">{{scenario-assumption}}</div>
        <div data-text-role="caption">{{scenario-note}}</div>
      </article>
    </div>
  </div>
</section>
