<section class="builtin-layout" data-layout="image-grid">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <figure class="bl-media" data-repeat="images">
        <img src="{{image-src}}" alt="{{image-alt}}" />
        <figcaption data-text-role="caption">{{image-caption}}</figcaption>
      </figure>
    </div>
  </div>
</section>
