<section class="builtin-layout" data-layout="image-hero">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <figure class="bl-media">
      <img src="{{image-src}}" alt="{{image-alt}}" />
    </figure>
    <div data-text-role="caption">{{image-note}}</div>
  </div>
</section>
