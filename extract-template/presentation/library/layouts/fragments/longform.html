<section class="builtin-layout" data-layout="longform">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="body">{{introduction}}</div>
        <div data-text-role="body">{{paragraph-1}}</div>
        <div data-text-role="body">{{paragraph-2}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{aside-heading}}</div>
        <div data-text-role="body">{{aside-body}}</div>
      </div>
    </div>
  </div>
</section>
