<section class="builtin-layout" data-layout="metric-deep-dive">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="metric-value">{{metric-value}}</div>
        <div data-text-role="label">{{metric-label}}</div>
        <div data-text-role="body">{{trend}}</div>
      </div>
      <div class="bl-stack">
        <article class="bl-item" data-repeat="drivers">
          <div data-text-role="heading">{{item-heading}}</div>
          <div data-text-role="body">{{item-body}}</div>
        </article>
      </div>
    </div>
  </div>
</section>
