<section class="builtin-layout" data-layout="process-steps">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-4">
      <article class="bl-stack" data-repeat="steps">
        <div data-text-role="label">{{step-number}}</div>
        <div data-text-role="heading">{{step-title}}</div>
        <div data-text-role="body">{{step-description}}</div>
      </article>
    </div>
    <div data-text-role="caption">{{process-note}}</div>
  </div>
</section>
