<section class="builtin-layout" data-layout="pros-cons">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="heading">{{benefit-heading}}</div>
        <div class="bl-stack">
          <article class="bl-item" data-repeat="benefits">
            <div data-text-role="heading">{{item-heading}}</div>
            <div data-text-role="body">{{item-body}}</div>
          </article>
        </div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{limitation-heading}}</div>
        <div class="bl-stack">
          <article class="bl-item" data-repeat="limitations">
            <div data-text-role="heading">{{item-heading}}</div>
            <div data-text-role="body">{{item-body}}</div>
          </article>
        </div>
      </div>
    </div>
  </div>
</section>
