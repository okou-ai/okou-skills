<section class="builtin-layout" data-layout="quote-cards">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <blockquote class="bl-stack" data-repeat="quotes">
        <div data-text-role="body">{{quotation}}</div>
        <div data-text-role="label">{{attribution}}</div>
        <div data-text-role="caption">{{quote-context}}</div>
      </blockquote>
    </div>
  </div>
</section>
