<section class="builtin-layout" data-layout="roadmap">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <article class="bl-stack" data-repeat="horizons">
        <div data-text-role="label">{{horizon}}</div>
        <div data-text-role="heading">{{deliverable}}</div>
        <div data-text-role="body">{{roadmap-note}}</div>
      </article>
    </div>
  </div>
</section>
