<section class="builtin-layout" data-layout="section-divider">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <div data-text-role="metric-value">{{section-number}}</div>
      <div data-text-role="body">{{section-summary}}</div>
    </div>
  </div>
</section>
