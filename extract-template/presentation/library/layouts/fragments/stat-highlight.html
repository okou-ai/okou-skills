<section class="builtin-layout" data-layout="stat-highlight">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="metric-value">{{metric-value}}</div>
        <div data-text-role="label">{{metric-label}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{interpretation}}</div>
        <div data-text-role="body">{{context}}</div>
        <div data-text-role="caption">{{source-note}}</div>
      </div>
    </div>
  </div>
</section>
