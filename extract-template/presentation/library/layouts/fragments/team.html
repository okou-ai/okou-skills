<section class="builtin-layout" data-layout="team">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <article class="bl-stack" data-repeat="people">
        <div data-text-role="heading">{{person-name}}</div>
        <div data-text-role="label">{{person-role}}</div>
        <div data-text-role="body">{{person-responsibility}}</div>
      </article>
    </div>
  </div>
</section>
