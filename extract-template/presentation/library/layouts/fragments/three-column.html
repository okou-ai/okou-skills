<section class="builtin-layout" data-layout="three-column">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-3">
      <div class="bl-stack">
        <div data-text-role="heading">{{column-1-heading}}</div>
        <div data-text-role="body">{{column-1-body}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{column-2-heading}}</div>
        <div data-text-role="body">{{column-2-body}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{column-3-heading}}</div>
        <div data-text-role="body">{{column-3-body}}</div>
      </div>
    </div>
  </div>
</section>
