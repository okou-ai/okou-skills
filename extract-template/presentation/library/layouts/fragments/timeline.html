<section class="builtin-layout" data-layout="timeline">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <article class="bl-timeline-row" data-repeat="events">
        <div data-text-role="label">{{event-date}}</div>
        <div class="bl-stack">
          <div data-text-role="heading">{{event-title}}</div>
          <div data-text-role="body">{{event-description}}</div>
        </div>
      </article>
    </div>
  </div>
</section>
