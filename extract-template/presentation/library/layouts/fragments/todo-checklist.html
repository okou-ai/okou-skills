<section class="builtin-layout" data-layout="todo-checklist">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-stack">
      <article class="bl-action" data-repeat="actions">
        <div data-text-role="label">{{action-state}}</div>
        <div data-text-role="heading">{{action-title}}</div>
        <div data-text-role="caption">{{action-owner}}</div>
        <div data-text-role="body">{{action-note}}</div>
      </article>
    </div>
  </div>
</section>
