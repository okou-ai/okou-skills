<section class="builtin-layout" data-layout="two-column">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="heading">{{left-heading}}</div>
        <div data-text-role="body">{{left-body}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="heading">{{right-heading}}</div>
        <div data-text-role="body">{{right-body}}</div>
      </div>
    </div>
  </div>
</section>
