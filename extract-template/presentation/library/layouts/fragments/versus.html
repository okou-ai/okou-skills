<section class="builtin-layout" data-layout="versus">
  <header class="bl-header" data-fit-region="title">
    <div data-text-role="title">{{title}}</div>
  </header>
  <div class="bl-body" data-fit-region="body">
    <div class="bl-grid bl-columns-2">
      <div class="bl-stack">
        <div data-text-role="metric-value">{{left-value}}</div>
        <div data-text-role="label">{{left-label}}</div>
        <div data-text-role="body">{{left-evidence}}</div>
      </div>
      <div class="bl-stack">
        <div data-text-role="metric-value">{{right-value}}</div>
        <div data-text-role="label">{{right-label}}</div>
        <div data-text-role="body">{{right-evidence}}</div>
      </div>
    </div>
  </div>
</section>
