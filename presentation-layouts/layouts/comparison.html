<section class="okp-layout" data-layout="comparison">
  <header data-fit-region="title"><div data-text-role="title">{{title}}</div></header>
  <div class="okp-main okp-pair">
    <article class="okp-stack" data-component="card" data-fit-region="option-a"><div data-text-role="heading">{{option-a}}</div><div data-text-role="body">{{evidence-a}}</div></article>
    <article class="okp-stack" data-component="card" data-fit-region="option-b"><div data-text-role="heading">{{option-b}}</div><div data-text-role="body">{{evidence-b}}</div></article>
  </div>
</section>
