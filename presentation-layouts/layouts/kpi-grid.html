<section class="okp-layout" data-layout="kpi-grid">
  <header data-fit-region="title"><div data-text-role="title">{{title}}</div></header>
  <div class="okp-main okp-grid" data-fit-region="metrics">
    <article class="okp-stack" data-component="metric" data-repeat="metrics">
      <div data-text-role="metric-value">{{value}}</div>
      <div data-text-role="metric-label">{{label}}</div>
      <div data-text-role="caption">{{note}}</div>
    </article>
  </div>
</section>
