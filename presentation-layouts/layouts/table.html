<section class="okp-layout" data-layout="table">
  <header data-fit-region="title"><div data-text-role="title">{{title}}</div></header>
  <div class="okp-main okp-stack" data-fit-region="table">
    <table data-component="table">
      <thead><tr><th data-repeat="columns" data-text-role="table-header">{{column}}</th></tr></thead>
      <tbody><tr data-repeat="rows"><td data-repeat="cells" data-text-role="table-cell">{{cell}}</td></tr></tbody>
    </table>
    <div data-text-role="caption">{{source-note}}</div>
  </div>
</section>
