      //
      // Bridges the baked Shiki tokens (window.__TOKENS) into Three.js: the tokens are drawn once
      // to an offscreen 2D canvas (a CanvasTexture), which then drives a lit 3D slab, a dissolve
      // shader, or a GPU particle system. Determinism per the project contract:
      //   - render only via tl.eventCallback("onUpdate", …) + one initial render() — never rAF
      //   - all randomness from a seeded mulberry32 — never Math.random / Date.now
      //   - system-font canvas metrics are captured synchronously during setup
      //   - paused GSAP timeline registered on window.__timelines[id]; HF seeks it per frame
      //
      // Each block sets window.__BLOCK = { id, effect, seq, duration, seed } and includes this engine.

 await document.fonts.load('500 222.86px "Okou Motion"');
 const timingRoot=document.getElementById("root");
 const holdInput=new URLSearchParams(location.search).get("hold");
 const holdValue=holdInput===null?.25:Number(holdInput);
 const hold=Number.isFinite(holdValue)?Math.max(0,Math.min(1,holdValue)):.25;
 window.__brandTiming={entry:1.9,hold:hold,total:1.9+hold};

        // ---- seeded PRNG (no Math.random) -----------------------------------------
        function mulberry32(a) {

            var t = state.tokens[i];

            aOrigin[i * 3 + 2] = sz;
            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;
            aDelay[i] = rng();
          }

          var geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          geo.setAttribute("aOrigin", new THREE.BufferAttribute(aOrigin, 3));
          geo.setAttribute("aTarget", new THREE.BufferAttribute(aTarget, 3));
          geo.setAttribute("aColor", new THREE.BufferAttribute(aColor, 3));
          geo.setAttribute("aDelay", new THREE.BufferAttribute(aDelay, 1));

          var uniforms = {
            uProgress: { value: 0 },
            uSize: { value: 1.0 },
            uAlpha: { value: 1 },
          };
          var mat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            transparent: true,
            depthTest: false,
            depthWrite: false,
            blending: THREE.NormalBlending,
            vertexShader: [
              "attribute vec3 aOrigin; attribute vec3 aTarget; attribute vec3 aColor; attribute float aDelay;",
              "uniform float uProgress; uniform float uSize;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  float span = 0.62;",
              "  float p = clamp((uProgress - aDelay*(1.0-span)) / span, 0.0, 1.0);",
              "  p = p*p*(3.0-2.0*p);",
              "  vec3 pos = mix(aOrigin, aTarget, p);",
              "  vec4 mv = modelViewMatrix * vec4(pos, 1.0);",
              "  gl_Position = projectionMatrix * mv;",
              "  gl_PointSize = uSize * (60.0 / -mv.z) * mix(0.62, 0.32, p);",
              "  vColor = aColor; vP = p;",
              "}",
            ].join("\n"),
            fragmentShader: [
              "precision highp float; uniform float uAlpha;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  vec2 d = gl_PointCoord - 0.5;",
              "  float r2 = dot(d, d);",
              "  if (r2 > 0.25) discard;",
              "  float a = smoothstep(0.25, 0.02, r2);",
              // brighter & whiter in flight, resolves to true color as it lands
              "  vec3 c = mix(vColor + vec3(0.06)*(1.0-vP), vColor, vP);",
              "  gl_FragColor = vec4(c, a * (0.7 + 0.3*vP) * uAlpha);",
              "}",
            ].join("\n"),
          });

          var pts = new THREE.Points(geo, mat);
          pts.renderOrder = 1;
          scene.add(pts);

          var crispTexture = new THREE.CanvasTexture(crispCode.canvas);
          crispTexture.minFilter = THREE.LinearFilter;
          crispTexture.magFilter = THREE.LinearFilter;
          crispTexture.generateMipmaps = false;
          var crispMat = new THREE.MeshBasicMaterial({
            map: crispTexture,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false,
          });
          var crispPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(worldW, worldH),
            crispMat,
          );
          crispPlane.renderOrder = 2;
          scene.add(crispPlane);

          camera.position.set(0, 0, 10);
          var vfov = (camera.fov * Math.PI) / 180;
          var sa = 1920 / 1080;
          var fitH = worldH / 2 / Math.tan(vfov / 2);
          var fitW = worldW / 2 / (Math.tan(vfov / 2) * sa);
          camera.position.z = Math.max(fitH, fitW);
          camera.lookAt(0, 0, 0);

          tl.to(
            uniforms.uProgress,
            { value: 1.0, duration: 1.65, ease: "power2.out" },
            0,
          );
          tl.to(
            uniforms.uAlpha,
            { value: 0, duration: 0.2, ease: "power2.in" },
            1.65,
          );
          tl.to(
            crispMat,
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            1.65,
          );

          // uProgress is tweened by GSAP; the boot loop's render() draws once per frame.
          return function () {};
        }

        // ---- dispatch + boot ------------------------------------------------------
        function buildEffect(THREE, scene, camera, renderer, spec, st, tl) {
          var state = T[spec.seq].states[0];
          var dur = spec.duration;
          if (spec.effect === "particles")
            return fxParticles(
              THREE,
              scene,
              camera,
              renderer,
              state,
              st,
              tl,
              dur,
              spec.seed,
            );
          return function () {};
        }

        // Free GPU resources (renderer, geometries, materials, textures) on page teardown.
        // One-shot renders exit per job so nothing leaks there; this guards long-lived
        // Studio/player sessions that reload. Fires only on unload — never during capture.
        function disposeGL(renderer, scene) {
          scene.traverse(function (o) {
            if (o.geometry && o.geometry.dispose) o.geometry.dispose();
            var mats = o.material
              ? Array.isArray(o.material)
                ? o.material
                : [o.material]
              : [];
            mats.forEach(function (m) {
              if (m.map && m.map.dispose) m.map.dispose();
              if (
                m.uniforms &&
                m.uniforms.uTex &&
                m.uniforms.uTex.value &&
                m.uniforms.uTex.value.dispose
              ) {
                m.uniforms.uTex.value.dispose();
              }
              if (m.dispose) m.dispose();
            });
          });
          if (renderer.dispose) renderer.dispose();
        }

        function go() {
          var spec = window.__BLOCK;
          var root = document.getElementById("root");
          var glcanvas = document.getElementById("gl");
          var W = 1920;
          var H = 1080;
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });


          var THREE = window.THREE;
          var renderer = new THREE.WebGLRenderer({
            canvas: glcanvas,
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: true,
          });
          renderer.setPixelRatio(1);
          renderer.setSize(W, H, false);
          var scene = new THREE.Scene();
          var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
          var st = {};

          var renderFn = buildEffect(
            THREE,
            scene,
            camera,
            renderer,
            spec,
            st,
            tl,
          );
          function render() {
            renderFn();
            renderer.render(scene, camera);
          }
          tl.eventCallback("onUpdate", render);
          tl.set(root.querySelector('.apl-lockup'),{opacity:1},1.9);
          tl.set(glcanvas,{opacity:0},1.9);
          tl.seek(0);render();
          timingRoot.querySelector(".msl-reveal .msl-wordmark,.sdl-wordmark,.plr-wordmark,.cbl-wordmark,.ils-wordmark,.lcc-wordmark,.ibl-wordmark,.ssl-wordmark,.fml-wordmark,.apl-wordmark,.wtl-final-wordmark,#parts-assemble-lockup-wordmark").setAttribute('data-brand-wordmark','');
 timingRoot.querySelector(".msl-reveal .msl-mark,.plr-mark,.cbl-mark,.ils-mark,.lcc-mark,.ibl-mark,.ssl-mark,.fml-mark,.apl-mark,.sdl-mark-stage,.wtl-final-mark,#parts-assemble-lockup-mark-stage").setAttribute('data-okou-mark','');
 tl.to({clock:0},{clock:1,duration:window.__brandTiming.total,ease:"none"},0);
 window.__timelines[spec.id]= tl;
          window.addEventListener("beforeunload", function () {
            disposeGL(renderer, scene);
          });
        }

        go();
      })();
    </script>
  </body>
</html>
